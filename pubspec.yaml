name: myapp
description: "LUEN AI Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # [필수] 다국어 지원
  flutter_localizations:
    sdk: flutter

  # --- [1. UI & 디자인] ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1         # [업데이트] 최신 폰트 버전
  intl: ^0.20.0                # [유지] 아까 성공한 버전 (SDK 호환)
  flutter_markdown: ^0.7.3     # [업데이트] 공식 패키지 최신 버전 (절대 비공식 plus 쓰지 마세요)

  # --- [2. 루나의 핵심 기능] ---
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2          # [유지] 최신 안정 버전
  shared_preferences: ^2.3.2   # [업데이트] 저장소 기능 최신화
  image_picker: ^1.1.2         # [업데이트] 최신 안드로이드 대응
  permission_handler: ^11.3.1  # [업데이트] 권한 관리 최신화
  
  # --- [3. 생존 & 하이브리드] ---
  audio_session: ^0.1.21
  wakelock_plus: ^1.2.8

  # --- [4. 외부 연결] ---
  http: ^1.2.2                 # [업데이트] 보안 패치 적용됨
  google_generative_ai: ^0.4.0 # [유지] 0.4.x 대에서 가장 안정적

  # --- [5. 수익화] ---
  google_mobile_ads: ^5.3.1    # [유지] 아까 성공한 버전 (가장 중요!)
  in_app_purchase: ^3.2.0      # [업데이트] 결제 모듈 최신화
  audioplayers: ^6.5.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0        # [업데이트] 코드 검사 도구 최신화

flutter:
  uses-material-design: true