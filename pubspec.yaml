name: myapp
description: "LUEN AI Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # [필수] 다국어 지원
  flutter_localizations:
    sdk: flutter

  # --- [1. UI & 디자인] ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # [수정] 충돌 해결을 위해 버전을 0.20.0으로 상향
  intl: ^0.20.0
  flutter_markdown: ^0.7.3

  # --- [2. 루나의 핵심 기능] ---
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.3.2
  
  # [필수] 로컬 미디어 DB 저장용
  path_provider: ^2.1.2

  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  
  # --- [3. 생존 & 하이브리드] ---
  audio_session: ^0.1.21
  wakelock_plus: ^1.2.8

  # --- [4. 외부 연결] ---
  http: ^1.2.2
  google_generative_ai: ^0.4.0

  # --- [5. 수익화] ---
  google_mobile_ads: ^5.3.1
  in_app_purchase: ^3.2.0
  audioplayers: ^6.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true